name: fogros2-sgc

services:
  rib:
    image: redislabs/redismod
    ports:
      - '8002:6379'

  signal:
    build:
      context: ./
      dockerfile: ./Dockerfile
    init: true
    ports:
      - '8000:8000'
    command: /signaling_server

  redisinsight:
    image: redislabs/redisinsight:latest
    ports:
      - '8001:5540'

  talker:
    build:
      context: ./
      dockerfile: ./Dockerfile
    volumes:
      - "./src:/src"
      - "./scripts:/scripts"
      - "./secrets:/secrets"
    depends_on:
      - rib
      - signal
    environment:
      SGC_CONFIG: "${SGC_CONFIG_TALKER:-talker-docker.toml}"
      FANOUT_FACTOR: "${FANOUT_FACTOR:-3}"
      SGC_ROUTING_TRACE: "${SGC_ROUTING_TRACE:-0}"
      BENCH_LATENCY: "${BENCH_LATENCY:-0}"
      BENCH_LATENCY_HZ: "${BENCH_LATENCY_HZ:-20}"
      BENCH_PAYLOAD_BYTES: "${BENCH_PAYLOAD_BYTES:-0}"
      RMW_IMPLEMENTATION: "rmw_cyclonedds_cpp"
      CYCLONEDDS_URI: "file:///fog_ws/cyclonedds.ubuntu.2204.xml"
    init: true
    command: >
      bash -c "source /opt/ros/humble/setup.bash;
      if [ \"${BENCH_LATENCY:-0}\" = \"1\" ]; then
        echo \"BENCH_LATENCY: starting talker helper\" ;
        if [ ! -f /scripts/bench_latency_talker.py ]; then
          echo \"BENCH_LATENCY_ERROR: missing /scripts/bench_latency_talker.py\" ;
        else
          (python3 /scripts/bench_latency_talker.py 2>&1 || echo \"BENCH_LATENCY_ERROR: talker helper exited nonzero\") &
        fi;
      fi;
      ros2 run demo_nodes_py talker &
      /sgc router"

  listener:
    build:
      context: ./
      dockerfile: ./Dockerfile
    volumes:
      - "./src:/src"
      - "./scripts:/scripts"
      - "./secrets:/secrets"
    depends_on:
      - rib
      - signal
      - talker
    environment:
      SGC_CONFIG: "${SGC_CONFIG_LISTENER:-listener-docker.toml}"
      FANOUT_FACTOR: "${FANOUT_FACTOR:-3}"
      SGC_ROUTING_TRACE: "${SGC_ROUTING_TRACE:-0}"
      BENCH_LATENCY: "${BENCH_LATENCY:-0}"
      BENCH_LATENCY_HZ: "${BENCH_LATENCY_HZ:-20}"
      RMW_IMPLEMENTATION: "rmw_cyclonedds_cpp"
      CYCLONEDDS_URI: "file:///fog_ws/cyclonedds.ubuntu.2204.xml"
    init: true
    command: >
      bash -c "source /opt/ros/humble/setup.bash;
      if [ \"${BENCH_LATENCY:-0}\" = \"1\" ]; then
        echo \"BENCH_LATENCY: starting listener helper\" ;
        if [ ! -f /scripts/bench_latency_listener.py ]; then
          echo \"BENCH_LATENCY_ERROR: missing /scripts/bench_latency_listener.py\" ;
        else
          (python3 /scripts/bench_latency_listener.py 2>&1 || echo \"BENCH_LATENCY_ERROR: listener helper exited nonzero\") &
        fi;
      fi;
      ros2 run demo_nodes_py listener &
      /sgc router"

  proxy:
    build:
      context: ./
      dockerfile: ./Dockerfile
    volumes:
      - "./src:/src"
      - "./scripts:/scripts"
      - "./secrets:/secrets"
    depends_on:
      - rib
      - signal
    environment:
      SGC_CONFIG: "${SGC_CONFIG_PROXY:-proxy-docker.toml}"
      FANOUT_FACTOR: "${FANOUT_FACTOR:-3}"
      SGC_ROUTING_TRACE: "${SGC_ROUTING_TRACE:-0}"
      RMW_IMPLEMENTATION: "rmw_cyclonedds_cpp"
      CYCLONEDDS_URI: "file:///fog_ws/cyclonedds.ubuntu.2204.xml"
    init: true
    command: >
      bash -c "source /opt/ros/humble/setup.bash;
      /sgc router"

  dashboard:
    image: node:18-alpine
    working_dir: /app
    volumes:
      - ./dashboard:/app
    command: ["sh", "-c", "npm install && npm start"]
    ports:
      - '3000:3000'
    depends_on:
      - rib
    environment:
      REDIS_HOST: rib
      REDIS_PORT: 6379
