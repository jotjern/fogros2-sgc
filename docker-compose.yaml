version: "3"
name: fogros2-sgc-lite

services:
    rib: 
      image: redislabs/redismod
      ports:
        - '8002:6379'  # use 8002 for public interface of redis

    signal:
      restart: always
      build: 
        context: ./
        dockerfile: ./Dockerfile
      init: true
      ports:
        - '8000:8000'  # use 8000 for public interface of signaling server
      command: >
        /signaling_server

    redisinsight:
      restart: always
      image: redislabs/redisinsight:latest
      ports:
      - '8001:5540' # use 8002 for public interface of redis insight
                    # port 5540 is the inside-docker port

    talker:
        restart: always
        build: 
          context: ./
          dockerfile: ./Dockerfile
        volumes:
          - "./src:/src" 
          - "./scripts:/scripts" 
        depends_on:
          - rib 
          - signal
        environment:
          SGC_CONFIG: "talker-docker.toml"
          RMW_IMPLEMENTATION: "rmw_cyclonedds_cpp"
          CYCLONEDDS_URI: "file:///fog_ws/cyclonedds.ubuntu.2204.xml"
        init: true
        cap_add:
          - NET_ADMIN
        command: >
          bash -c "apt-get update -qq && apt-get install -qq -y iproute2;
          source /opt/ros/humble/setup.bash; 
          python3 /fog_ws/benchmark_code/fogros2_examples/talker_throughput.py & 
          /gdp-router router"
    listener:
        restart: always
        build: 
          context: ./
          dockerfile: ./Dockerfile
        volumes:
          - "./src:/src" 
          - "./scripts:/scripts" 
        depends_on:
          - rib
          - signal
          - talker
        environment:
          SGC_CONFIG: "listener-docker.toml"
          RMW_IMPLEMENTATION: "rmw_cyclonedds_cpp"
          CYCLONEDDS_URI: "file:///fog_ws/cyclonedds.ubuntu.2204.xml"
        init: true
        command: >
          bash -c "source /opt/ros/humble/setup.bash; 
          ros2 run demo_nodes_py listener & 
          /gdp-router router"
    proxy1:
        restart: always
        build: 
          context: ./
          dockerfile: ./Dockerfile
        volumes:
          - "./src:/src" 
          - "./scripts:/scripts" 
        depends_on:
          - rib
          - signal
        environment:
          SGC_CONFIG: "proxy-docker.toml"
          RMW_IMPLEMENTATION: "rmw_cyclonedds_cpp"
          CYCLONEDDS_URI: "file:///fog_ws/cyclonedds.ubuntu.2204.xml"
        # TODO: this is a hack to make sure the subscriber is started after the publisher
        # will also test the scenario that is opposite
        init: true
        command: >
          bash -c "source /opt/ros/humble/setup.bash; 
          /gdp-router router"
    proxy2:
        restart: always
        build: 
          context: ./
          dockerfile: ./Dockerfile
        volumes:
          - "./src:/src" 
          - "./scripts:/scripts" 
        depends_on:
          - rib
          - signal
        environment:
          SGC_CONFIG: "proxy-docker.toml"
          RMW_IMPLEMENTATION: "rmw_cyclonedds_cpp"
          CYCLONEDDS_URI: "file:///fog_ws/cyclonedds.ubuntu.2204.xml"
        # TODO: this is a hack to make sure the subscriber is started after the publisher
        # will also test the scenario that is opposite
        init: true
        command: >
          bash -c "source /opt/ros/humble/setup.bash; 
          /gdp-router router"
    proxy3:
        restart: always
        build: 
          context: ./
          dockerfile: ./Dockerfile
        volumes:
          - "./src:/src" 
          - "./scripts:/scripts" 
        depends_on:
          - rib
          - signal
        environment:
          SGC_CONFIG: "proxy-docker.toml"
          RMW_IMPLEMENTATION: "rmw_cyclonedds_cpp"
          CYCLONEDDS_URI: "file:///fog_ws/cyclonedds.ubuntu.2204.xml"
        # TODO: this is a hack to make sure the subscriber is started after the publisher
        # will also test the scenario that is opposite
        init: true
        command: >
          bash -c "source /opt/ros/humble/setup.bash; 
          /gdp-router router"
    dashboard:
        restart: always
        image: node:18-alpine
        working_dir: /app
        volumes:
          - ./dashboard:/app
        command: ["npm", "start"]
        ports:
          - '3000:3000'
        depends_on:
          - rib
        environment:
          REDIS_HOST: rib
          REDIS_PORT: 6379
