name: fogros2-sgc-lite

services:
    rib: 
      image: redislabs/redismod
      ports:
        - '8002:6379'  # use 8002 for public interface of redis

    signal:
      restart: always
      build: 
        context: ./
        dockerfile: ./Dockerfile
      init: true
      ports:
        - '8000:8000'  # use 8000 for public interface of signaling server
      command: >
        /signaling_server

    redisinsight:
      restart: always
      image: redislabs/redisinsight:latest
      ports:
      - '8001:5540' # use 8002 for public interface of redis insight
                    # port 5540 is the inside-docker port

    talker:
        restart: always
        build: 
          context: ./
          dockerfile: ./Dockerfile
        volumes:
          - "./src:/src" 
          - "./scripts:/scripts" 
        depends_on:
          - rib 
          - signal
        environment:
          SGC_CONFIG: "talker-docker.toml"
          FANOUT_FACTOR: "${FANOUT_FACTOR:-3}"
          RMW_IMPLEMENTATION: "rmw_cyclonedds_cpp"
          CYCLONEDDS_URI: "file:///fog_ws/cyclonedds.ubuntu.2204.xml"
        init: true
        command: >
          bash -c "source /opt/ros/humble/setup.bash; 
          if [ \"${BENCH_LATENCY:-0}\" = \"1\" ]; then
            echo \"BENCH_LATENCY: starting talker helper\" ;
            if [ ! -f /scripts/bench_latency_talker.py ]; then
              echo \"BENCH_LATENCY_ERROR: missing /scripts/bench_latency_talker.py\" ;
            else
              (python3 /scripts/bench_latency_talker.py 2>&1 || echo \"BENCH_LATENCY_ERROR: talker helper exited nonzero\") &
            fi;
          fi;
          ros2 run demo_nodes_py talker & 
          /gdp-router router"
    listener:
        restart: always
        build: 
          context: ./
          dockerfile: ./Dockerfile
        volumes:
          - "./src:/src" 
          - "./scripts:/scripts" 
        depends_on:
          - rib
          - signal
          - talker
        environment:
          SGC_CONFIG: "listener-docker.toml"
          FANOUT_FACTOR: "${FANOUT_FACTOR:-3}"
          RMW_IMPLEMENTATION: "rmw_cyclonedds_cpp"
          CYCLONEDDS_URI: "file:///fog_ws/cyclonedds.ubuntu.2204.xml"
        # TODO: this is a hack to make sure the subscriber is started after the publisher
        # will also test the scenario that is opposite
        init: true
        command: >
          bash -c "source /opt/ros/humble/setup.bash; 
          if [ \"${BENCH_LATENCY:-0}\" = \"1\" ]; then
            echo \"BENCH_LATENCY: starting listener helper\" ;
            if [ ! -f /scripts/bench_latency_listener.py ]; then
              echo \"BENCH_LATENCY_ERROR: missing /scripts/bench_latency_listener.py\" ;
            else
              (python3 /scripts/bench_latency_listener.py 2>&1 || echo \"BENCH_LATENCY_ERROR: listener helper exited nonzero\") &
            fi;
          fi;
          ros2 run demo_nodes_py listener & 
          /gdp-router router"
    proxy:
        restart: always
        build: 
          context: ./
          dockerfile: ./Dockerfile
        volumes:
          - "./src:/src" 
          - "./scripts:/scripts" 
        depends_on:
          - rib
          - signal
        environment:
          SGC_CONFIG: "proxy-docker.toml"
          FANOUT_FACTOR: "${FANOUT_FACTOR:-3}"
          RMW_IMPLEMENTATION: "rmw_cyclonedds_cpp"
          CYCLONEDDS_URI: "file:///fog_ws/cyclonedds.ubuntu.2204.xml"
        # TODO: this is a hack to make sure the subscriber is started after the publisher
        # will also test the scenario that is opposite
        init: true
        command: >
          bash -c "source /opt/ros/humble/setup.bash; 
          /gdp-router router"

    dashboard:
        restart: always
        image: node:18-alpine
        working_dir: /app
        volumes:
          - ./dashboard:/app
        command: ["sh", "-c", "npm install && npm start"]
        ports:
          - '3000:3000'
        depends_on:
          - rib
        environment:
          REDIS_HOST: rib
          REDIS_PORT: 6379
