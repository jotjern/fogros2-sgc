name: fogros2-sgc

services:
  # Redis for routing state
  rib:
    image: redislabs/redismod
    ports:
      - '8003:6379'

  # WebRTC signaling server
  signal:
    restart: always
    build:
      context: ./
      dockerfile: ./Dockerfile
    init: true
    ports:
      - '8005:8000'
    environment:
      REDIS_URL: "redis://rib:6379"
    command: /signaling_server

  # Redis GUI (optional, for debugging)
  redisinsight:
    restart: always
    image: redislabs/redisinsight:latest
    ports:
      - '8004:5540'

  # Demo: ROS2 talker (publisher)
  talker:
    restart: always
    build:
      context: ./
      dockerfile: ./Dockerfile
    volumes:
      - "./src:/src"
      - "./secrets:/secrets"
    depends_on:
      - rib
      - signal
    environment:
      SGC_CONFIG: "talker-docker.toml"
      RMW_IMPLEMENTATION: "rmw_cyclonedds_cpp"
      CYCLONEDDS_URI: "file:///fog_ws/cyclonedds.ubuntu.2204.xml"
    init: true
    command: >
      bash -c "source /opt/ros/humble/setup.bash;
      ros2 run demo_nodes_py talker &
      /sgc router"

  # Demo: ROS2 listener (subscriber)
  listener:
    restart: always
    build:
      context: ./
      dockerfile: ./Dockerfile
    volumes:
      - "./src:/src"
      - "./secrets:/secrets"
    depends_on:
      - rib
      - signal
      - talker
    environment:
      SGC_CONFIG: "listener-docker.toml"
      RMW_IMPLEMENTATION: "rmw_cyclonedds_cpp"
      CYCLONEDDS_URI: "file:///fog_ws/cyclonedds.ubuntu.2204.xml"
    init: true
    command: >
      bash -c "source /opt/ros/humble/setup.bash;
      ros2 run demo_nodes_py listener &
      /sgc router"

  # Demo: Proxy (for scaling)
  proxy:
    restart: always
    build:
      context: ./
      dockerfile: ./Dockerfile
    volumes:
      - "./src:/src"
      - "./secrets:/secrets"
    depends_on:
      - rib
      - signal
    environment:
      SGC_CONFIG: "proxy-docker.toml"
      RMW_IMPLEMENTATION: "rmw_cyclonedds_cpp"
      CYCLONEDDS_URI: "file:///fog_ws/cyclonedds.ubuntu.2204.xml"
    init: true
    command: >
      bash -c "source /opt/ros/humble/setup.bash;
      /sgc router"

  # Dashboard for visualization
  dashboard:
    restart: always
    image: node:18-alpine
    working_dir: /app
    volumes:
      - ./dashboard:/app
    command: ["sh", "-c", "npm install && npm start"]
    ports:
      - '3001:3000'
    depends_on:
      - rib
    environment:
      REDIS_HOST: rib
      REDIS_PORT: 6379
