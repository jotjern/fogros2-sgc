# SGC Configuration - Docker Proxy
#
# Proxy config for scaling demo. Proxies relay messages between
# publishers and subscribers to reduce direct connection count.

group_secret = "demo"
signaling_server = "ws://signal:8000"
routing_server = "rib:6379"

[[topics]]
name = "/chatter"
type = "std_msgs/msg/String"
role = "proxy"
