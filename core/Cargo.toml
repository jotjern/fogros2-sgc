[package]
name = "core"
version = "0.0.1-beta"
authors = ["Eric Chen <kych@berkeley.edu>", "Jiachen Yuan <jcyuan_johnson@berkeley.edu>"]
description = "FogROS2-SGC core library for ROS2 message routing over WebRTC"
edition = "2021"

[features]
default = ["ros"]
ros = []

[dependencies]
utils = { path = "../utils" }

# Core utilities
rand = "0.8"
getrandom = "0.2"
log = "0.4"
anyhow = "1.0"
sha2 = "0.10"
base64 = "0.13"

# Serialization
serde = "1.0"
serde_json = "1.0"

# Async runtime
tokio = { version = "1.22", features = ["full"] }
futures = "0.3"
parking_lot = "0.12"

# Enum derive macros
strum = "0.24"
strum_macros = "0.24"

# WebRTC and WebSocket
async-datachannel = "0.4"
async-tungstenite = { version = "0.17", features = ["tokio-openssl"] }
tokio-openssl = "0.6"
openssl = "0.10"

# ROS2 bindings
r2r = { git = "https://github.com/jotjern/r2r.git" }

# Redis for routing state
redis = "0.23"
redis-async = "0.16"
